<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  body { font-family: Roboto, Inter, -apple-system, sans-serif; font-size: 13px; color: #333; margin: 0; padding: 14px; }
  h1 { font-size: 14px; font-weight: 500; margin: 0 0 8px; }
  .muted { color: #616161; font-size: 12px; line-height: 1.45; }
  button { font-family: inherit; font-size: 14px; font-weight: 500; height: 36px; padding: 0 16px;
           border: none; border-radius: 12px; background: #448AFF; color: #fff; cursor: pointer; }
  button:hover { background: #3969D5; }
  button:disabled { background: #D6D6D6; cursor: default; }
  #log { margin-top: 12px; font-size: 12px; line-height: 1.5; white-space: pre-wrap; color: #333;
         max-height: 180px; overflow: auto; border-top: 1px solid #E0E0E0; padding-top: 10px; }
</style>
</head>
<body>
  <h1>Описания компонентов iiko DS</h1>
  <div class="muted" id="info">Загружаю свежие данные…</div>
  <div style="margin-top:12px"><button id="run" disabled>Проставить описания</button></div>
  <div id="log"></div>

  <script>
    // Данные НЕ вшиты в плагин: код плагина неизменен, свежесть берётся из сети.
    // raw.githubusercontent — без CDN, всегда актуальный; Pages — запасной источник.
    var SOURCES = [
      'https://raw.githubusercontent.com/Anders7Rusk/iiko-ds-web/main/plugin/descriptions.json',
      'https://anders7rusk.github.io/iiko-ds-web/plugin/descriptions.json'
    ];

    var DATA = null;
    var info = document.getElementById('info');
    var log = document.getElementById('log');
    var btn = document.getElementById('run');

    function counts(d) {
      var vs = d.variants || {};
      var n = 0;
      Object.keys(vs).forEach(function (k) { n += Object.keys(vs[k]).length; });
      return { sets: Object.keys(d.set_desc || {}).length, comps: Object.keys(vs).length, vars: n };
    }

    function load(i) {
      if (i >= SOURCES.length) {
        info.textContent = 'Не удалось загрузить данные из сети.';
        log.textContent = 'Проверь доступ из Figma к raw.githubusercontent.com и anders7rusk.github.io.\n' +
                          'Если сеть закрыта — напиши мне, соберу офлайн-версию с данными внутри.';
        return;
      }
      var url = SOURCES[i] + '?v=' + Date.now();
      fetch(url, { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        })
        .then(function (d) {
          DATA = d;
          var c = counts(d);
          info.textContent = 'Данные загружены: сетов ' + c.sets + ', компонентов с вариантами ' +
            c.comps + ', описаний вариантов ' + c.vars +
            (d.generated_at ? '. Версия данных: ' + d.generated_at : '');
          btn.disabled = false;
        })
        .catch(function (e) {
          log.textContent += 'Источник ' + (i + 1) + ': ' + e.message + '\n';
          load(i + 1);
        });
    }

    load(0);

    btn.onclick = function () {
      if (!DATA) return;
      btn.disabled = true;
      log.textContent = 'Применяю…';
      parent.postMessage({ pluginMessage: { type: 'apply', data: DATA } }, '*');
    };

    onmessage = function (e) {
      var m = e.data.pluginMessage;
      if (!m || m.type !== 'done') return;
      btn.disabled = false;
      var out = 'Готово.\n' +
        'Сетов найдено: ' + m.setsFound + ' из ' + m.setsTotal + '\n' +
        'Описаний сетов с кликабельной ссылкой (markdown): ' + m.mdWritten + '\n' +
        'Описаний сетов обычным текстом: ' + m.setsWritten + '\n' +
        'Описаний вариантов записано: ' + m.varsWritten + '\n' +
        'Поле Link очищено: ' + m.linksCleared;
      if (m.mdErrors && m.mdErrors.length) {
        out += '\n⚠️ Ошибки markdown:\n' + m.mdErrors.join('\n');
      }
      if (m.notFoundSets && m.notFoundSets.length) {
        out += '\n⚠️ Не найдены сеты (id): ' + m.notFoundSets.join(', ');
      }
      if (m.notFoundVariantsCount) {
        out += '\n⚠️ Не найдены варианты (' + m.notFoundVariantsCount + '):\n' + m.notFoundVariants.join('\n');
      }
      log.textContent = out;
    };
  </script>
</body>
</html>
