<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Главная — каталог B2B Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css?v=311">
<link rel="stylesheet" href="../components/components.css?v=311">
<link rel="stylesheet" href="../components/button.css?v=311">
<link rel="stylesheet" href="../components/input.css?v=311">
<link rel="stylesheet" href="../components/card.css?v=311">
</head>
<body style="margin:0;background:#F5F5F5;color:#212121;font-family:'Roboto','Helvetica Neue',Arial,sans-serif;">
<div style="display:flex;flex-direction:column;height:100vh;">

  <!-- ПАГЕ-ХРОМ (нет ДС-компонента): шапка -->
  <header style="height:64px;flex-shrink:0;position:sticky;top:0;z-index:10;background:#FFFFFF;box-shadow:0 2px 4px rgba(0,0,0,.08);display:flex;align-items:center;">
    <div style="width:100%;max-width:1600px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:32px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;color:#424242;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M22,10v12H2V10l7-3v2l5-2l0,0l0,3H22z M17.2,8.5L18,2h3l0.8,6.5H17.2z M11,18h2v-4h-2V18z M7,18h2v-4H7V18z M17,14h-2v4h2V14z" fill="currentColor"/></svg>
        </span>
        <div>
          <div style="font-size:13px;font-weight:500;line-height:16px;color:#212121;">Пищевое производство</div>
          <div style="font-size:11px;font-weight:400;line-height:14px;color:#757575;">B2B Portal</div>
        </div>
      </div>
      <nav style="flex:1;display:flex;justify-content:center;">
        <a href="#" style="font-size:14px;font-weight:500;color:#616161;text-decoration:none;padding:4px 16px;border-radius:4px;white-space:nowrap;">Каталог</a>
      </nav>
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:14px;font-weight:500;color:#424242;white-space:nowrap;">Весёлая бурёнка</span>
        <button class="ds-btn ds-btn--m ds-btn--neutral ds-btn--text" type="button">
          <span class="ds-btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59z" fill="currentColor"/><path d="M19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" fill="currentColor"/></svg></span>
          <span class="ds-btn__label">Выход</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ТЕЛО -->
  <div style="flex:1;display:flex;justify-content:center;padding:16px;overflow:auto;">
    <div style="display:flex;gap:24px;width:100%;max-width:1600px;align-items:flex-start;">

      <!-- САЙДБАР: Категории -->
      <aside style="width:260px;flex-shrink:0;">
        <div class="ds-card ds-card--shadow" style="border-radius:12px;">
          <div class="ds-card__header"><h3 class="ds-card__title">Категории</h3></div>
          <div class="ds-card__content">
            <div class="ds-list-item ds-list-item--selected" style="display:flex;align-items:center;gap:12px;background:#E3F2FD;border-radius:8px;padding:0 12px;min-height:44px;cursor:pointer;">
              <span style="display:flex;align-items:center;color:#1976D2;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4h-4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z" fill="currentColor"/></svg></span>
              <span class="ds-list-item__label" style="font-size:15px;font-weight:500;color:#1976D2;">Все товары</span>
            </div>
            <div class="ds-list-item" style="display:flex;align-items:center;gap:12px;border-radius:8px;padding:0 12px;min-height:44px;cursor:pointer;">
              <span style="display:flex;align-items:center;color:#616161;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2l-5.5 9h11z" fill="currentColor"/><circle cx="17.5" cy="17.5" r="4.5" fill="currentColor"/><path d="M3 13.5h8v8H3z" fill="currentColor"/></svg></span>
              <span class="ds-list-item__label" style="font-size:15px;font-weight:500;color:#616161;">Салаты</span>
            </div>
            <div class="ds-list-item" style="display:flex;align-items:center;gap:12px;border-radius:8px;padding:0 12px;min-height:44px;cursor:pointer;">
              <span style="display:flex;align-items:center;color:#616161;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 2l-5.5 9h11z" fill="currentColor"/><circle cx="17.5" cy="17.5" r="4.5" fill="currentColor"/><path d="M3 13.5h8v8H3z" fill="currentColor"/></svg></span>
              <span class="ds-list-item__label" style="font-size:15px;font-weight:500;color:#616161;">Категория без имени</span>
            </div>
          </div>
        </div>
      </aside>

      <!-- МЭЙН -->
      <main style="flex:1;display:flex;flex-direction:column;gap:16px;min-width:0;">

        <!-- ПОИСК + СБРОСИТЬ ФИЛЬТРЫ (в одну строку) -->
        <div class="ds-card ds-card--shadow" style="border-radius:8px;">
          <div class="ds-card__content" style="display:flex;flex-direction:row;align-items:center;gap:24px;">
            <div class="ds-input ds-input--m" style="flex:1;">
              <div class="ds-input__frame">
                <span class="ds-input__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/></svg></span>
                <div class="ds-input__content">
                  <input class="ds-input__field" placeholder="Поиск товаров">
                </div>
              </div>
            </div>
            <button class="ds-btn ds-btn--m ds-btn--neutral ds-btn--text" type="button" style="flex-shrink:0;">
              <span class="ds-btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M19.79,5.61C20.3,4.95,19.83,4,19,4H6.83l7.97,7.97L19.79,5.61z" fill="currentColor"/><path d="M2.81,2.81L1.39,4.22L10,13v6c0,0.55,0.45,1,1,1h2c0.55,0,1-0.45,1-1v-2.17l5.78,5.78l1.41-1.41L2.81,2.81z" fill="currentColor"/></svg></span>
              <span class="ds-btn__label">Сбросить все фильтры</span>
            </button>
          </div>
        </div>

        <!-- КАТАЛОГ -->
        <div class="ds-card ds-card--shadow" style="border-radius:8px;overflow:hidden;">
          <div class="ds-card__content" style="padding:0;overflow-x:auto;">

            <!-- Панель Салаты (4) -->
            <div class="ds-expansion-group-panel ds-expansion-group-panel--collaps panel--open" id="p1">
              <button type="button" class="phead" style="width:100%;display:flex;align-items:center;gap:8px;background:#FAFAFA;border:none;padding:20px 16px;cursor:pointer;text-align:left;font-family:inherit;">
                <span style="font-size:14px;font-weight:700;color:#212121;">Салаты</span>
                <span style="font-size:12px;color:#757575;">(4)</span>
                <span style="margin-left:auto;display:inline-flex;color:#616161;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" fill="currentColor"/></svg></span>
              </button>
              <div class="pbody" style="padding:0 16px 16px;">
                <table style="width:100%;border-collapse:collapse;table-layout:fixed;">
                  <thead>
                    <tr style="height:56px;">
                      <th style="width:220px;text-align:left;padding:0 16px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:#424242;border-bottom:1px solid #E0E0E0;">Наименование</th>
                      <th style="width:90px;text-align:left;padding:0 16px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:#424242;border-bottom:1px solid #E0E0E0;">Артикул</th>
                      <th style="width:300px;text-align:left;padding:0 16px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:#424242;border-bottom:1px solid #E0E0E0;">Описание</th>
                      <th style="width:90px;text-align:left;padding:0 16px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:#424242;border-bottom:1px solid #E0E0E0;">Ед. изм.</th>
                      <th style="width:90px;text-align:left;padding:0 16px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:#424242;border-bottom:1px solid #E0E0E0;">Цена</th>
                      <th style="width:150px;text-align:left;padding:0 16px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:#424242;border-bottom:1px solid #E0E0E0;">Количество</th>
                      <th style="width:90px;text-align:left;padding:0 16px;font-size:11px;font-weight:500;letter-spacing:.4px;text-transform:uppercase;color:#424242;border-bottom:1px solid #E0E0E0;">Сумма</th>
                    </tr>
                  </thead>
                  <tbody id="tbody"></tbody>
                </table>
              </div>
            </div>

            <!-- Панель Категория без имени (1) -->
            <div class="ds-expansion-group-panel ds-expansion-group-panel--collaps" id="p2">
              <button type="button" class="phead" style="width:100%;display:flex;align-items:center;gap:8px;background:#FAFAFA;border:none;padding:20px 16px;cursor:pointer;text-align:left;font-family:inherit;">
                <span style="font-size:14px;font-weight:700;color:#212121;">Категория без имени</span>
                <span style="font-size:12px;color:#757575;">(1)</span>
                <span style="margin-left:auto;display:inline-flex;color:#616161;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" fill="currentColor"/></svg></span>
              </button>
              <div class="pbody" style="padding:0 16px 16px;display:none;">
                <table style="width:100%;min-width:1244px;border-collapse:collapse;table-layout:fixed;white-space:nowrap;">
                  <thead><tr style="height:56px;"><th style="width:318px;border-bottom:1px solid #E0E0E0;"></th><th style="width:129px;border-bottom:1px solid #E0E0E0;"></th><th style="width:144px;border-bottom:1px solid #E0E0E0;"></th><th style="width:125px;border-bottom:1px solid #E0E0E0;"></th><th style="width:106px;border-bottom:1px solid #E0E0E0;"></th><th style="width:311px;border-bottom:1px solid #E0E0E0;"></th><th style="width:111px;border-bottom:1px solid #E0E0E0;"></th></tr></thead>
                  <tbody><tr>
                    <td style="padding:16px;"><a href="#" style="font-size:15px;font-weight:500;color:#1565C0;text-decoration:none;">Шоколадный батончик</a></td>
                    <td style="padding:16px;font-size:15px;color:#212121;">00003</td>
                    <td style="padding:16px;font-size:15px;color:#212121;"></td>
                    <td style="padding:16px;font-size:15px;color:#212121;">шт</td>
                    <td style="padding:16px;font-size:15px;color:#212121;">100 ₽</td>
                    <td style="padding:16px;"><span data-qty="0" data-price="100"></span></td>
                    <td style="padding:16px;font-size:15px;color:#212121;">0 ₽</td>
                  </tr></tbody>
                </table>
              </div>
            </div>

          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- ПАГЕ-ХРОМ: футер -->
  <footer style="flex-shrink:0;position:sticky;bottom:0;z-index:10;background:#FFFFFF;border-top:1px solid #E0E0E0;padding:16px 0;">
    <div style="display:flex;justify-content:space-between;align-items:center;max-width:1600px;margin:0 auto;padding:0 16px;">
      <div id="fleft" style="display:flex;align-items:center;gap:24px;font-size:15px;color:#424242;">
        <span>Товаров: <b id="fitems" style="color:#212121;">2</b></span>
        <span>Общая сумма: <b id="fsum" style="color:#212121;font-size:18px;">600 ₽</b></span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="ds-btn ds-btn--m ds-btn--neutral ds-btn--outlined" type="button">
          <span class="ds-btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z" fill="currentColor"/></svg></span>
          <span class="ds-btn__label">Посмотреть заказ</span>
        </button>
        <button class="ds-btn ds-btn--m ds-btn--accent ds-btn--filled" type="button">
          <span class="ds-btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7,18c-1.1,0-1.99,0.9-1.99,2S5.9,22,7,22s2-0.9,2-2S8.1,18,7,18z M17,18c-1.1,0-1.99,0.9-1.99,2s0.89,2,1.99,2s2-0.9,2-2S18.1,18,17,18z M8.1,13h7.45c0.75,0,1.41-0.41,1.75-1.03L21,4.96L19.25,4l-3.7,7H8.53L4.27,2H1v2h2l3.6,7.59l-1.35,2.44C4.52,15.37,5.48,17,7,17h12v-2H7L8.1,13z M12,2l4,4l-4,4l-1.41-1.41L12.17,7L8,7l0-2l4.17,0l-1.59-1.59L12,2z" fill="currentColor"/></svg></span>
          <span class="ds-btn__label">Оформить заказ</span>
        </button>
      </div>
    </div>
  </footer>

</div>

<script>
(function(){
  var D=[
    {name:'Жареная куриная грудка',art:'00024',desc:'обжаренная на сливочном масле свежая курочка в панировке',unit:'порц',price:200,qty:2},
    {name:'Апельсин',art:'00012',desc:'',unit:'кг',price:200,qty:1},
    {name:'Салат весенний',art:'00028',desc:'',unit:'порц',price:170,qty:0},
    {name:'Салат Цезарь',art:'00025',desc:'',unit:'порц',price:500,qty:0}
  ];
  var tb=document.getElementById('tbody');
  D.forEach(function(r){
    var tr=document.createElement('tr');
    tr.style.height='72px';
    function td(txt,cls){var d=document.createElement('td');d.style.padding='0 16px 16px';d.style.fontSize='15px';d.style.color='#212121';if(cls)d.style.fontWeight='500';d.textContent=txt;return d;}
    var tdName=document.createElement('td');tdName.style.padding='0 16px 16px';tdName.innerHTML='<a href="#" style="font-size:15px;font-weight:500;color:#1565C0;text-decoration:none;">'+r.name+'</a>';
    tr.appendChild(tdName);
    tr.appendChild(td(r.art));
    var tdDesc=document.createElement('td');tdDesc.style.padding='0 16px 16px';tdDesc.style.fontSize='15px';tdDesc.style.color='#212121';tdDesc.style.whiteSpace='nowrap';tdDesc.style.overflow='hidden';tdDesc.style.textOverflow='ellipsis';tdDesc.style.maxWidth='100%';tdDesc.textContent=r.desc;tr.appendChild(tdDesc);
    tr.appendChild(td(r.unit));
    tr.appendChild(td(r.price+' ₽'));
    // Количество — ds-input-number
    var tdQty=document.createElement('td');tdQty.style.padding='0 16px 16px';
    var wrap=document.createElement('div');wrap.className='ds-input-number ds-input-number--s ds-input-number--populated';wrap.style.display='inline-flex';wrap.style.alignItems='center';wrap.style.gap='8px';
    var bm=document.createElement('button');bm.type='button';bm.className='ds-btn ds-btn--m ds-btn--neutral ds-btn--text';bm.setAttribute('aria-label','Уменьшить');bm.style.cssText='min-width:0;padding:0;width:36px;height:36px;border-radius:50%;';
    bm.innerHTML='<span class="ds-btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 13V11H19V13H5Z" fill="currentColor"/></svg></span>';
    var inp=document.createElement('input');inp.className='qty__val';inp.type='text';inp.inputMode='numeric';inp.readOnly=true;inp.value=r.qty;
    inp.style.cssText='text-align:center;border:none;outline:none;background:transparent;font:inherit;width:40px;color:#212121;';
    var bp=document.createElement('button');bp.type='button';bp.className='ds-btn ds-btn--m ds-btn--neutral ds-btn--text';bp.setAttribute('aria-label','Увеличить');bp.style.cssText='min-width:0;padding:0;width:36px;height:36px;border-radius:50%;color:#616161;';
    bp.innerHTML='<span class="ds-btn__icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/></svg></span>';
    bm.onclick=function(){var v=parseInt(inp.value)||0; if(v>0){inp.value=v-1; recalc();}};
    bp.onclick=function(){var v=parseInt(inp.value)||0; inp.value=v+1; recalc();};
    wrap.appendChild(bm);wrap.appendChild(inp);wrap.appendChild(bp);
    tdQty.appendChild(wrap);
    tr.appendChild(tdQty);
    // Сумма
    var tdSum=document.createElement('td');tdSum.style.padding='0 16px 16px';tdSum.style.fontSize='15px';tdSum.style.color='#212121';tdSum.className='c-sum';tdSum.textContent=(r.qty*r.price)+' ₽';
    tr.appendChild(tdSum);
    tb.appendChild(tr);
  });
  function recalc(){
    var items=0,total=0;
    tb.querySelectorAll('tr').forEach(function(tr){
      var rows=tr.querySelectorAll('td');
      var inp=tr.querySelector('.qty__val');var v=parseInt(inp.value)||0;
      var price=parseInt(rows[4].textContent)||0;
      var sum=rows[6];sum.textContent=(v*price)+' ₽';
      var minus=tr.querySelector('[aria-label="Уменьшить"]');
      if(minus)minus.style.opacity=(v<=0?'0.4':'1');
      if(v>0)items++;
      total+=v*price;
    });
    document.getElementById('fitems').textContent=items;
    document.getElementById('fsum').textContent=total+' ₽';
  }
  recalc();
  document.getElementById('p1').querySelector('.phead').addEventListener('click',function(){this.parentNode.querySelector('.pbody').style.display=this.parentNode.querySelector('.pbody').style.display==='none'?'block':'none';});
  document.getElementById('p2').querySelector('.phead').addEventListener('click',function(){this.parentNode.querySelector('.pbody').style.display=this.parentNode.querySelector('.pbody').style.display==='none'?'block':'none';});
})();
</script>
</body>
</html>
