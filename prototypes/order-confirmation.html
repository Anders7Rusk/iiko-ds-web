    font-weight: var(--ds-typography-font-weight-medium);

  .content { max-width: 770px; }

  .card-title-row { display: flex; align-items: center; gap: var(--ds-space-2x); }
  .card-title-row .ds-card__title {

  .stack-12 { display: flex; flex-direction: column; gap: var(--ds-space-3x); }
  .footer-nav {

  }
  .footer-nav__counter { color: var(--ds-color-text-primary); font-weight: var(--ds-typography-font-weight-medium); }
  .hint-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; flex-shrink: 0;
    color: var(--ds-color-icon-primary);
  }
  .hint-icon svg { width: 20px; height: 20px; display: block; }

  .w-280 { width: 280px; }
